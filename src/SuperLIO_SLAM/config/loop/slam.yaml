super_lio_node:
  ros__parameters:
    slam.keyframe.enable: true
    slam.keyframe.distance: 1.5
    slam.keyframe.angle_deg: 10.0
    slam.keyframe.max_interval: 3.0
    slam.keyframe.min_points: 250
    slam.keyframe.voxel_leaf: 0.2

loop_backend_node:
  ros__parameters:
    keyframe_cloud_voxel_size: 0.2
    keyframe_cloud_max_points: 30000

    # iSAM2 graph, corrected map, and repeated-loop suppression.
    loop_min_interval: 20
    loop_candidate_radius_m: 15.0  # maximum raw-odometry distance for Scan Context candidates
    sc_candidate_count: 10  # eligible ring-key neighbors to compare
    sc_distance_threshold: 0.13  # strict upper bound on Scan Context distance
    loop_min_time_separation_s: 30.0  # candidate stamp gap must be strictly greater
    graph_prior_translation_sigma: 0.001
    graph_prior_rotation_sigma: 0.001
    graph_odom_translation_sigma: 0.1
    graph_odom_rotation_sigma: 0.05
    graph_loop_translation_sigma: 0.2
    graph_loop_rotation_sigma: 0.1
    graph_loop_huber_k: 1.345
    registration_queue_capacity: 2  # pending tasks; overflow evicts oldest detection only
    map_publish_stride: 30
    # Export all retained backend keyframes using final PGO poses, independently
    # of the visualization limits below. Relative paths resolve from launch cwd.
    save_map_path: "map/optimized_map.pcd"
    save_map_voxel_size: 0.2  # 0 streams every retained point without voxel fusion
    save_map_on_shutdown: false
    map_max_keyframes: 2000
    map_max_points_per_keyframe: 3000
    map_voxel_size: 0.2
    path_max_poses: 10000
    tf_publish_rate_hz: 20.0
