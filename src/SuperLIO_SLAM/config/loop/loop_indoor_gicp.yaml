# Multi-frame GICP settings for Scan Context loop candidates.
loop_backend_node:
  ros__parameters:
    # gicp 阈值
    gicp_correspondence_randomness: 20
    gicp_max_correspondence_distance_m: 2.0
    gicp_max_iterations: 40
    # gicp 质量
    quality_max_inlier_mse_m2: 0.10
    quality_max_refinement_rotation_deg: 180.0 # 细化后的旋转角度阈值
    quality_max_refinement_translation_m: 5.0  # 细化后的平移距离阈值
    quality_min_current_frame_overlap: 0.90    # 重叠百分比阈值
    quality_min_information_ratio: 1.0e-05
    quality_min_inlier_count: 100
    quality_min_source_overlap: 0.90
    quality_nn_radius_m: 1.0
    # 配准相关信息限制
    registration_max_source_points: 10000
    registration_max_target_points: 50000
    registration_min_points: 100
    registration_soft_budget_ms: 500.0
    registration_submap_max_duration_s: 6.0
    registration_submap_max_keyframes: 4
    registration_submap_max_travel_distance_m: 6.0
    registration_voxel_size_m: 0.3
    registration_top_k: 3
